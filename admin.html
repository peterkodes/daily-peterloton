<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Administration | Viva Mídia</title>
<style>
:root{color-scheme:light;--ink:#22201e;--muted:#65615d;--line:#e4ded8;--bg:#f6f4f1;--accent:#b74709;--card:#fff}*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink)}a{color:var(--accent);text-underline-offset:3px}header{background:#22201e;color:white;padding:20px max(20px,calc((100vw - 1140px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}header a{color:white}header strong{font-size:21px;letter-spacing:.03em}header small{display:block;color:#d2c8bf}.brand{color:#ff883e}main{max-width:1180px;margin:auto;padding:24px 20px 60px}h1{font-size:29px;margin:0 0 4px}h2{font-size:20px;margin:0 0 14px}p{margin:8px 0}.muted{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-top:18px}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:18px 0}.metric{background:white;border:1px solid var(--line);border-radius:10px;padding:16px}.metric strong{font-size:29px;display:block;color:var(--accent)}nav,.tools,.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,select{font:inherit;border:1px solid #d3cbc3;border-radius:7px;background:white;color:var(--ink);padding:9px 13px;cursor:pointer}button[aria-current=true],button.primary{background:var(--accent);color:white;border-color:var(--accent)}button:disabled{opacity:.5;cursor:not-allowed}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #e68a4c;outline-offset:2px}#status{padding:12px 16px;border-left:4px solid var(--accent);background:white;overflow-wrap:anywhere}article{border-top:1px solid var(--line);padding:16px 0}article:first-child{border-top:0}article h3{font-size:16px;margin:0 0 5px}.text{white-space:pre-wrap;overflow-wrap:anywhere}.tag{font-weight:600;text-transform:capitalize;color:#56504a}.tag.approved{color:#146b40}.tag.rejected{color:#a12626}.tag.pending{color:#945511}.tools{justify-content:space-between;margin-bottom:12px}.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:15px}[hidden]{display:none!important}footer{color:var(--muted);font-size:13px;margin-top:32px}@media(max-width:600px){main{padding:16px 12px 40px}.card{padding:14px}header{padding:16px}h1{font-size:24px}}
</style></head><body>
<header><div><strong>VIVA <span class="brand">MÍDIA</span></strong><small>The Bike Diaries · Administration</small></div><a href="/">View publication ↗</a></header>
<main><h1>Administration center</h1><p class="muted">Editorial overview and comment moderation.</p><p id="status" role="status" aria-live="polite">Checking your access…</p>
<section id="gate" class="card" hidden><h2>Restricted access</h2><p id="gate-message"></p><a href="/account">Go to reader account</a></section>
<section id="dashboard" hidden><div class="tools"><p id="identity"></p><button id="refresh" type="button">Refresh</button></div>
<div class="metrics" id="metrics"></div>
<nav aria-label="Administration sections" id="tabs"><button type="button" data-tab="comments" aria-current="true">Comments</button><button type="button" data-tab="articles">Articles</button><button type="button" data-tab="authors">Authors</button><button type="button" data-tab="readers">Readers</button><button type="button" data-tab="logs">Activity log</button></nav>
<div class="card"><div class="tools"><h2 id="section-title">Comments</h2><label id="filter-label">Status <select id="filter"><option value="pending">Pending</option><option value="all">All comments</option><option value="approved">Approved</option><option value="rejected">Rejected</option><option value="hidden">Hidden</option></select></label></div><div id="records"></div><div class="pager"><button id="prev" type="button">Previous</button><span id="page">Page 1</span><button id="next" type="button">Next</button></div></div>
</section><noscript><p>JavaScript is required for the administration center.</p></noscript><footer>Viva Mídia · Independent administration · Pilot environment</footer></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2"></script><script src="/admin.js" defer></script><script src="/kodes-managed-admin.js" defer></script></body></html>
